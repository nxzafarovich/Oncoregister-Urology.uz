workflows:
  macos_onco_register:
    name: Onco Register macOS
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest

    scripts:
      - name: Show Xcode version
        script: |
          xcodebuild -version

      - name: Build unsigned macOS app
        script: |
          set -e
          mkdir -p build
          xcodebuild \
            -project "OncoRegister.xcodeproj" \
            -target "Onco Register" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build" \
            build

      - name: Package app
        script: |
          set -e
          cd "$CM_BUILD_DIR/build"
          ditto -c -k --sequesterRsrc --keepParent "Onco Register.app" "$CM_BUILD_DIR/Onco_Register_macOS.zip"

    artifacts:
      - Onco_Register_macOS.zip
      - build/Onco Register.app
